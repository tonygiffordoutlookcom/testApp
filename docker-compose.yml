version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: app_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      - PORT=5000

  frontend:
    build:
      context: ./frontend
    container_name: app_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
